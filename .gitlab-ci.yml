pages:
  stage: deploy
  script:
  - for file in $(find -name "*.md"); do
      pandoc -s -f markdown_github -t html -o ${file%.*}.html $file && echo "Exported ${file%.*}.html" || echo "ERROR $file";
    done
  - shopt -s extglob
  - mv !(public) public
  artifacts:
    paths:
    - public
  only:
  - ci
